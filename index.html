<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KODO BRAND | Anime Concept & Streetwear</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root { --kodo-red:#ff0033; --kodo-dark:#080808; }
body { background:var(--kodo-dark); font-family:'Inter',sans-serif; color:white; scroll-behavior:smooth; overflow-x:hidden; }
.font-kodo { font-family:'Orbitron',sans-serif; }

.manga-overlay{
background-image:url('https://w0.peakpx.com/wallpaper/447/194/HD-wallpaper-manga-wall-manga-anime.jpg');
background-size:cover;
background-position:center;
opacity:.15;
filter:grayscale(1) contrast(1.5);
}

.glass{background:rgba(8,8,8,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.05);}
.text-stroke{-webkit-text-stroke:1px rgba(255,255,255,.3);color:transparent;}
.product-card{transition:.4s;border:1px solid rgba(255,255,255,.03);background:#0c0c0c;}
.product-card:hover{border-color:var(--kodo-red);transform:translateY(-5px);}
.btn-kodo:active{transform:scale(.95);}
</style>
</head>

<body>

<div class="bg-red-600 text-white text-[10px] font-black uppercase tracking-[0.4em] py-2 text-center">
Drop Limitado: O Despertar + Linha Tática de Mochilas
</div>

<header class="glass sticky top-0 z-50 h-20 flex items-center px-6">
<div class="max-w-7xl mx-auto w-full flex justify-between items-center">

<div class="font-kodo text-3xl italic tracking-tighter">KODO<span class="text-[#ff0033]">.</span></div>

<nav class="hidden md:flex gap-8 text-[11px] font-bold uppercase tracking-widest italic">
<a href="#loja" class="hover:text-red-500 transition">Coleções</a>
<a href="https://www.instagram.com/emily_medeiiros" target="_blank" class="hover:text-red-500 transition underline underline-offset-4 decoration-red-500">@emily_medeiiros</a>
<a href="https://wa.me/5543996177415" class="text-red-500">WhatsApp</a>
</nav>

<div class="flex items-center gap-4">

<!-- Carrinho -->
<button onclick="toggleCart()" class="relative text-xl">
🛒
<span id="cartCount" class="absolute -top-2 -right-3 bg-red-600 text-[10px] px-2 py-0.5 rounded-full">0</span>
</button>

</div>
</div>
</header>

<section class="relative h-[90vh] flex items-center justify-center">
<div class="absolute inset-0 manga-overlay z-0"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black z-10"></div>

<div class="relative z-20 text-center px-6">
<h2 class="text-red-500 font-bold tracking-[1em] uppercase text-[10px] mb-4">Conceito Autoral Anime</h2>
<h1 class="font-kodo text-5xl md:text-[120px] leading-none tracking-tighter mb-6 uppercase">
FRAGMENTOS <br> <span class="text-stroke italic">DO DESTINO</span>
</h1>
<p class="max-w-xl mx-auto text-gray-400 text-sm md:text-lg mb-10 font-light italic">
Vestuário autoral por Emily Medeiros. Criado para quem carrega a alma dos animes no streetwear.
</p>
<a href="#loja" class="bg-red-600 px-10 py-4 font-black text-xs uppercase tracking-widest hover:bg-white hover:text-black transition-all btn-kodo shadow-lg shadow-red-900/40">Garantir Drop 01</a>
</div>
</section>

<main id="loja" class="max-w-7xl mx-auto px-6 py-20">
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8" id="products"></div>
</main>

<!-- Drawer Carrinho -->
<div id="cartDrawer" class="fixed top-0 right-[-400px] w-[350px] h-full bg-black shadow-2xl transition-all duration-500 z-50 p-6 overflow-y-auto">

<div class="flex justify-between items-center mb-6">
<h3 class="font-kodo text-lg">Seu Carrinho</h3>
<button onclick="toggleCart()">✕</button>
</div>

<div id="cartItems" class="flex flex-col gap-4 text-sm"></div>

<div class="mt-6 border-t border-white/10 pt-4">
<p class="flex justify-between font-bold">
Total: <span id="cartTotal">R$ 0</span>
</p>
<button onclick="finalizarCompra()" class="mt-4 w-full bg-red-600 py-3 text-xs font-black uppercase">
Finalizar no WhatsApp
</button>
</div>
</div>

<script>
const zap="5543996177415";

const produtos=[
{tipo:'Camiseta',nome:"Vazio Primordial",preco:149,img:"https://images.unsplash.com/photo-1583743814966-8936f5b7be1a"},
{tipo:'Mochila',nome:"Mochila Shinobi Tech",preco:289,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62"},
{tipo:'Camiseta',nome:"Ascensão Azul",preco:159,img:"https://images.unsplash.com/photo-1576566588028-4147f3842f27"},
{tipo:'Camiseta',nome:"Eclipse Sangrento",preco:149,img:"https://images.unsplash.com/photo-1618354691373-d851c5c3a990"}
];

let cart=JSON.parse(localStorage.getItem("kodoCart"))||[];

function renderProducts(){
const container=document.getElementById("products");
container.innerHTML=produtos.map(p=>`
<div class="product-card p-4 group">
<div class="relative overflow-hidden aspect-square mb-6 bg-zinc-900">
<img src="${p.img}?q=80&w=800" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500">
<div class="absolute top-0 left-0 bg-red-600 text-[8px] font-black uppercase px-2 py-1">${p.tipo}</div>
</div>
<h4 class="font-kodo text-xs uppercase tracking-tighter mb-3">${p.nome}</h4>
<div class="flex justify-between items-center">
<span class="font-black text-sm italic">R$ ${p.preco}</span>
<button onclick="addToCart('${p.nome}','${p.tipo}',${p.preco})"
class="bg-white text-black px-4 py-2 text-[9px] font-black uppercase hover:bg-red-600 hover:text-white transition btn-kodo">
Adicionar
</button>
</div>
</div>
`).join("");
}

function toggleCart(){
const drawer=document.getElementById("cartDrawer");
drawer.style.right=drawer.style.right==="0px"?"-400px":"0px";
}

function addToCart(nome,tipo,preco){
cart.push({nome,tipo,preco});
saveCart();
updateCart();
toggleCart();
}

function removeItem(index){
cart.splice(index,1);
saveCart();
updateCart();
}

function saveCart(){
localStorage.setItem("kodoCart",JSON.stringify(cart));
}

function updateCart(){
const cartItems=document.getElementById("cartItems");
const cartCount=document.getElementById("cartCount");
const cartTotal=document.getElementById("cartTotal");

cartItems.innerHTML="";
let total=0;

cart.forEach((item,index)=>{
total+=item.preco;
cartItems.innerHTML+=`
<div class="flex justify-between items-center border-b border-white/5 pb-2">
<div>
<p class="text-xs font-bold">${item.nome}</p>
<p class="text-[10px] text-gray-500">${item.tipo}</p>
</div>
<div class="text-right">
<p class="text-xs">R$ ${item.preco}</p>
<button onclick="removeItem(${index})" class="text-red-500 text-[10px]">Remover</button>
</div>
</div>
`;
});

cartCount.innerText=cart.length;
cartTotal.innerText="R$ "+total;
}

function finalizarCompra(){
if(cart.length===0){alert("Seu carrinho está vazio!");return;}

let mensagem="Olá Emily! Quero finalizar meu pedido:%0A";
cart.forEach(item=>{
mensagem+=`- ${item.nome} (${item.tipo}) - R$ ${item.preco}%0A`;
});

window.open(`https://wa.me/${zap}?text=${mensagem}`,"_blank");
}

renderProducts();
updateCart();
</script>

</body>
</html>
